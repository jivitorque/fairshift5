<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to FairShift...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var pathSegmentsToKeep = 1; // Preserve repo segment in https://<user>.github.io/<repo>/
        var l = window.location;
        var pathname = l.pathname;
        
        // If deployed to a subpath like /fairshift, redirect cleanly to /fairshift/
        if (!pathname.endsWith('/')) {
          var segments = pathname.split('/').filter(Boolean);
          if (segments.length === 1) {
            window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + segments[0] + '/' + l.search + l.hash);
            return;
          }
        }
        
        // Otherwise redirect to root of repo
        var repoBase = '/' + (pathname.split('/')[1] || '') + '/';
        window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase);
      })();
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">Redirecting to FairShift...</h2>
      <p style="color: #94a3b8; font-size: 0.875rem;">If you are not redirected automatically, <a href="./" style="color: #6366f1; text-decoration: underline;">click here</a>.</p>
    </div>
  </body>
</html>
